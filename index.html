<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Maxed Skill Gaming - games you can play in your browser</title>
  <meta name="description" content="Maxed Skill Gaming makes games you can play in your browser. Our first game is Heroes of the Wealdmark, a free online real-time RPG." />
  <link rel="canonical" href="https://maxedskillgaming.github.io/" />
  <link rel="icon" href="icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Maxed Skill Gaming" />
  <meta property="og:description" content="Games you can play in your browser. First up: Heroes of the Wealdmark." />
  <meta property="og:url" content="https://maxedskillgaming.github.io/" />
  <meta property="og:image" content="https://maxedskillgaming.github.io/wealdmark/shots/plaza.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Organization", "name": "Maxed Skill Gaming", "url": "https://maxedskillgaming.github.io/" }
  </script>
  <style>
    :root { --night: #120d1a; --night-2: #1b1427; --line: #3a2d50; --parchment: #ece2c8; --dim: #b2a68f; --gold: #e8b84a; --gold-deep: #7a5a14; --display: "Pixelify Sans", ui-monospace, monospace; --body: "Alegreya", Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--parchment); font: 1.15rem/1.65 var(--body); }
    a { color: var(--gold); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .wrap { max-width: 56rem; margin: 0 auto; padding-inline: max(1rem, env(safe-area-inset-left)) max(1rem, env(safe-area-inset-right)); }
    header { padding-block: 3rem 2rem; }
    h1 { font: 700 clamp(2rem, 5vw, 3rem)/1.05 var(--display); margin: 0 0 .75rem; text-wrap: balance; }
    .lede { color: var(--dim); margin: 0; max-width: 34rem; }
    h2 { font: 700 1.4rem var(--display); margin: 2.5rem 0 1rem; }
    .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 2rem; align-items: center; background: var(--night-2); border: 3px solid var(--line); box-shadow: 8px 8px 0 #000; padding: 1.25rem; text-decoration: none; color: inherit; }
    .game:hover, .game:focus-visible { border-color: var(--gold); }
    .game img { width: 100%; height: auto; display: block; image-rendering: pixelated; border: 3px solid var(--line); }
    .game h3 { font: 700 1.6rem/1.1 var(--display); margin: 0 0 .5rem; }
    .game p { margin: 0 0 1rem; color: var(--dim); }
    .play { font: 700 1.05rem var(--display); color: var(--gold); }
    footer { border-top: 3px solid var(--line); margin-top: 3.5rem; padding-block: 2rem 3rem; color: var(--dim); font-size: 1rem; }
    @media (max-width: 40rem) { .game { grid-template-columns: 1fr; gap: 1rem; box-shadow: 5px 5px 0 #000; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Maxed Skill Gaming</h1>
      <p class="lede">We make games you can play in your browser, free, with nothing to install.</p>
    </header>
    <main>
      <h2>Games</h2>
      <a class="game" href="wealdmark/">
        <img src="wealdmark/shots/plaza.jpg" width="800" height="475" alt="Bellstone Plaza in Heroes of the Wealdmark, a pixel-art market square." />
        <div>
          <h3>Heroes of the Wealdmark</h3>
          <p>A free online RPG with real-time fights, gear and skill training, and other heroes in the fields.</p>
          <span class="play">Play it now</span>
        </div>
      </a>
    </main>
    <footer>&copy; 2026 Maxed Skill Gaming.</footer>
  </div>
</body>
</html>
